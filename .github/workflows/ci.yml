name: CI

# PR-only gate. Pushes to main are validated by deploy-cloudflare.yml's
# `verify` job, which runs lint + test before deploying, so a duplicate
# CI run on every push would just re-do the same work.
on:
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# One run per branch; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to a full commit SHA: tags can be moved, SHAs cannot.
      # Installs pnpm and Node from package.json, then runs
      # `pnpm install --frozen-lockfile` and caches the pnpm store.
      - name: Set up pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error
